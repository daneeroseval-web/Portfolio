<!doctype html>
<html lang="en" data-title-key="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safari | Danée Roseval</title>
  <meta name="description" content="Safari, brand identity by Danée Roseval.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<body class="bc bc-safari" style="--bg:#000000;--ink:#FFFFFF;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.18);--surface:#141414;--blue:#FFFFFF;--on-blue:#000000;--bc-line:rgba(255,255,255,.18)">
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html" data-i18n-attr="aria-label:aria.home" aria-label="Danée Roseval, home"><img src="assets/logo.svg" alt="" width="40" height="40"></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html#work" data-i18n="nav.work">Work</a><a href="index.html#about" data-i18n="nav.about">About</a><a href="index.html#experience" data-i18n="nav.experience">Experience</a><a href="index.html#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="header-right">
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="nl">NL</button><button type="button" data-lang="en">EN</button></div>
      <span class="clock" data-i18n-attr="aria-label:aria.clock" aria-label="Local time in Velp"></span>
      <button class="theme-toggle" type="button" data-i18n-attr="aria-label:aria.theme" aria-label="Toggle dark mode"><span></span></button>
    </div>
  </div>
</header>
<main id="top">
    <section class="bc-hero wrap">
    <a class="cs-back" href="index.html#work" data-i18n-attr="aria-label:aria.back" aria-label="Back to all work">←</a>
    <h1 class="bc-title"><span>Safari</span></h1>
    <div class="bc-meta label"><span data-i18n="tag.identity"></span><span>2023</span><span class="cs-scroll"><i class="wheel"></i><span data-i18n="scroll.explore"></span></span></div>
    <figure class="bc-hero-media reveal" style="--r:16/9"><img src="assets/safari/safari-web-suitcase-detail-bw.jpg" alt=""></figure>
  </section>
  <section class="bc-posters section" style="--pbg:#E9E9E9;--pfg:#000000;--pc:4"><div class="wrap"><div class="section-head reveal"><h2 class="section-title" data-i18n="sec.feed"></h2><span class="rule"></span><span class="section-index">(01)</span></div><div class="grid"><figure class="reveal"><img src="assets/safari/safari-instagram-01-walkway-airport.jpg" alt="" loading="lazy"></figure><figure class="reveal"><img src="assets/safari/safari-instagram-02-suitcase-laptop-camera.jpg" alt="" loading="lazy"></figure><figure class="reveal"><img src="assets/safari/safari-instagram-03-sweatshirt-print.jpg" alt="" loading="lazy"></figure><figure class="reveal"><img src="assets/safari/safari-instagram-04-street-london.jpg" alt="" loading="lazy"></figure></div></div></section>
  <section class="section wrap"><div class="section-head reveal"><h2 class="section-title" data-i18n="sec.motion"></h2><span class="rule"></span><span class="section-index">(02)</span></div><div class="bc-motion reveal"><video src="assets/safari/safari-logo-anim.mp4" poster="assets/safari/safari-logo-anim-poster.jpg" autoplay muted loop playsinline preload="metadata"></video></div></section>
  <section class="section wrap"><div class="bc-intro"><h2 class="reveal" data-i18n-html="safari.intro"></h2><div class="info reveal"><span class="dot-label label" data-i18n="info.title"></span><details open><summary><span data-i18n="info.challenge"></span><i>+</i></summary><p data-i18n="safari.challenge"></p></details><details><summary><span data-i18n="info.solution"></span><i>+</i></summary><p data-i18n="safari.solution"></p></details><details><summary><span data-i18n="info.products"></span><i>+</i></summary><ul><li data-i18n="prod.logo"></li><li data-i18n="prod.anim"></li><li data-i18n="prod.icon"></li><li data-i18n="prod.instagram"></li></ul></details></div></div></section>
  <section class="section wrap"><div class="bc-chapters"><article class="reveal"><span class="num">01</span><h3 data-i18n="safari.s1.t"></h3><p data-i18n="safari.s1"></p></article><article class="reveal"><span class="num">02</span><h3 data-i18n="safari.s2.t"></h3><p data-i18n="safari.s2"></p></article><article class="reveal"><span class="num">03</span><h3 data-i18n="safari.s3.t"></h3><p data-i18n="safari.s3"></p></article></div></section>
  <section class="section wrap"><div class="section-head reveal"><h2 class="section-title" data-i18n="sec.logo"></h2><span class="rule"></span><span class="section-index">(03)</span></div><div class="bc-logos" style="--lc:4"><figure class="reveal"><div class="tile" style="background:#FFFFFF"><img src="assets/brand/safari/logo-stacked.svg" alt="" style=""></div><figcaption data-i18n="st.stacked"></figcaption></figure><figure class="reveal"><div class="tile" style="background:#111111"><img src="assets/brand/safari/logo-stacked.svg" alt="" style="filter:invert(1);"></div><figcaption data-i18n="st.dark"></figcaption></figure><figure class="reveal"><div class="tile" style="background:#E9E9E9"><img src="assets/brand/safari/logo-icon.svg" alt="" style=""></div><figcaption data-i18n="st.icon"></figcaption></figure><figure class="reveal"><div class="tile" style="background:#FFFFFF"><img src="assets/brand/safari/logo-horizontal.svg" alt="" style=""></div><figcaption data-i18n="st.horizontal"></figcaption></figure></div></section>
  <section class="section wrap"><div class="section-head reveal"><h2 class="section-title" data-i18n="sec.colour"></h2><span class="rule"></span><span class="section-index">(04)</span></div><div class="bc-cols reveal"><button class="bc-col" type="button" style="--c:#000000;--t:#fff" data-hex="#000000"><span class="cp">Copy</span><span class="n" data-i18n="col.black"></span><span class="h">#000000</span><span class="r">RGB 0 0 0</span></button><button class="bc-col" type="button" style="--c:#FFFFFF;--t:#000" data-hex="#FFFFFF"><span class="cp">Copy</span><span class="n" data-i18n="col.white"></span><span class="h">#FFFFFF</span><span class="r">RGB 255 255 255</span></button></div></section>
  <section class="section wrap"><div class="section-head reveal"><h2 class="section-title" data-i18n="sec.type"></h2><span class="rule"></span><span class="section-index">(05)</span></div><div class="reveal"><div class="bc-type" style="--tbg:#111;--tfg:#fff;--tfont:'Poppins';--tw:600;--tcase:none"><div class="aa">Aa</div><div><div class="fam">Poppins</div><p class="abc">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz<br>0123456789</p><p class="sample">Designed by Danée Roseval</p></div></div></div></section>
  <section class="wrap">
    <div class="rail-head reveal"><h2 data-i18n="more.title"></h2></div>
    <div class="more-grid" data-more="Safari"></div>
  </section>
  <section class="talk wrap">
    <span class="label" data-i18n="talk.label"></span>
    <a href="mailto:info@daneeroseval.com"><span data-i18n="talk.cta"></span> <i>↗</i></a>
  </section>
  <div class="wrap">
    <footer class="site-footer" style="margin-top:0">
      <span>© <span data-year-now></span> Danée Roseval</span>
      <span data-i18n="footer.place"></span>
      <a href="#top" onclick="scrollTo({top:0,behavior:'smooth'});return false" data-i18n="footer.top"></a>
    </footer>
    <div style="height:48px"></div>
  </div>
</main>
<script src="assets/i18n.js"></script>
<script src="assets/main.js"></script>
<script src="assets/brand/brand.js"></script>
</body>
</html>
